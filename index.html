
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAI Helper</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 35px 15px;
      background: #172554;
    }
    h1 { color: #60a5fa; }
    .container { padding: 20px; }
    .tool {
      background: #1e293b;
      padding: 20px;
      margin: 14px auto;
      border-radius: 12px;
      max-width: 400px;
    }
    p { color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <h1>SmartAI Helper</h1>
    <p>आपका अपना AI Assistant</p>
  </header>

  <div class="container">
    <h2>हमारे AI Tools</h2>
    <div class="tool">
      <h3>🤖 AI Chat</h3>
      <p>अपने सवालों के जवाब पाएँ।</p>
    </div>
    <div class="tool">
      <h3>▶️ YouTube Helper</h3>
      <p>वीडियो के टाइटल और हैशटैग बनाएँ।</p>
    </div>
    <div class="tool">
      <h3>🎬 AI Prompt Maker</h3>
      <p>फोटो और वीडियो के प्रॉम्प्ट बनाएँ।</p>
    </div>
    <div class="tool">
      <h3>📰 AI News</h3>
      <p>नई AI खबरें और ट्रेंड देखें।</p>
    </div>
  </div>
</body>
</html>
